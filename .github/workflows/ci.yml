name: CI

on:
  push:
    branches: [development]
  pull_request:

jobs:
  test:
    name: Fixture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hook copies are byte-identical
        run: |
          diff plugins/agentic-work-packages/hooks/enforce-scope.js \
               plugins/agentic-work-packages/skills/agentic-work-packages/assets/hooks/enforce-scope.js

      - name: Run the fixture tests
        run: |
          shopt -s nullglob
          tests=(plugins/agentic-work-packages/skills/agentic-work-packages/assets/tests/*.test.sh)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No fixture tests found — the glob matched nothing."
            exit 1
          fi
          status=0
          for t in "${tests[@]}"; do
            echo "=== $t ==="
            bash "$t" || status=1
          done
          exit $status
